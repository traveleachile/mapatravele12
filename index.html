<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrios Patrimoniales de Santiago</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #1f2a33; }
  body.locked { overflow: hidden; }

  header { background: #0b4f9e; color: #fff; padding: 10px 14px 12px; text-align: center; }
  header h1 { margin: 0; font-size: 18px; line-height: 1.25; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
  .lang-bar { margin-top: 8px; }
  .lang-label { font-size: 11px; opacity: .9; margin-bottom: 4px; }
  .lang-options { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .lang-btn { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.55); border-radius: 999px;
              padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .lang-btn.active { background: #fff; color: #0b4f9e; border-color: #fff; }

  .progress { background: #fff; padding: 8px 14px 10px; border-bottom: 1px solid #e1e5e9; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; max-width: 700px; margin: 0 auto 6px; }
  .progress strong { font-size: 14px; }
  .bar { height: 7px; background: #e1e5e9; border-radius: 20px; overflow: hidden; max-width: 700px; margin: auto; }
  .fill { height: 100%; width: 0; background: #ff7a10; transition: width .3s; }
  .progress.done .fill { background: #3a9d23; }
  .link-btn { background: none; border: 0; color: #0b4f9e; text-decoration: underline; font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px; }

  #map { height: 38vh; min-height: 260px; width: 100%; }

  .pin { width: 30px; height: 30px; border-radius: 50%; background: #0b4f9e; color: #fff; border: 3px solid #fff;
         display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
         box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .pin.visited { background: #3a9d23; }

  .places { padding: 10px 12px 0; max-width: 700px; margin: auto; }
  .place { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: inherit;
           background: #fff; border: 0; border-left: 4px solid #0b4f9e; border-radius: 10px; padding: 8px 10px;
           margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; }
  .place.visited { border-left-color: #3a9d23; }
  .place .num { width: 26px; height: 26px; border-radius: 50%; background: #0b4f9e; color: #fff; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .place.visited .num { background: #3a9d23; }
  .place h3 { margin: 0; font-size: 15px; line-height: 1.2; }
  .place p { margin: 2px 0 0; font-size: 12px; color: #66737f; line-height: 1.2; }
  .place .check { margin-left: auto; font-size: 18px; color: #3a9d23; visibility: hidden; }
  .place.visited .check { visibility: visible; }

  .completed { display: none; text-align: center; background: #fff; max-width: 676px; margin: 4px 12px 0; padding: 16px;
               border-radius: 12px; border: 2px solid #3a9d23; }
  .completed.show { display: block; }
  @media (min-width: 700px) { .completed { margin: 4px auto 0; } }
  .completed h2 { margin: 0 0 4px; color: #3a9d23; font-size: 20px; }
  .completed p { margin: 0 0 6px; color: #55616c; font-size: 14px; }

  /* Ficha */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9999; padding: 12px; overflow-y: auto; }
  .overlay.open { display: block; }
  .card { background: #fff; max-width: 560px; margin: 10px auto; border-radius: 18px; overflow: hidden; position: relative; }
  .card-image { display: block; width: 100%; height: 180px; object-fit: cover; background: #cfd6dc; }
  .close { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border: 0; border-radius: 50%;
           background: rgba(0,0,0,.65); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .card-content { padding: 16px 18px 18px; }
  .card-content h2 { margin: 0; color: #0b4f9e; font-size: 22px; line-height: 1.2; }
  .cuisine { display: inline-block; margin: 6px 0 10px; padding: 3px 10px; border-radius: 999px; background: #fff1e4; color: #c25a00; font-size: 12.5px; font-weight: 700; }
  .description { line-height: 1.55; color: #44505a; font-size: 15px; }
  .fact { margin-top: 12px; padding: 10px 12px; background: #eef6ff; border-radius: 10px; font-size: 14px; line-height: 1.45; color: #2b3a47; }
  .fact b { display: block; color: #0b4f9e; font-size: 12.5px; margin-bottom: 2px; }
  .address { margin-top: 12px; font-weight: 700; font-size: 14px; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; }
  .action { flex: 1; border: 0; padding: 10px 8px; border-radius: 9px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: #fff; }
  .maps { background: #ff7a10; }
  .next { background: #0b4f9e; }
  .card-image.postal { height: auto; object-fit: contain; }
  .info { margin-top: 12px; font-size: 14px; line-height: 1.45; color: #2b3a47; }
  .info-row { margin-top: 8px; }
  .info-row b { display: block; font-size: 12.5px; color: #0b4f9e; }
  .cats { margin-top: 14px; border-top: 1px solid #e1e5e9; }
  .cat { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eef1f4; }
  .cat img { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
  .cat-name { font-weight: 700; font-size: 14px; color: #1f2a33; }
  .cat-items { font-size: 12.5px; color: #66737f; line-height: 1.35; margin-top: 1px; }
  button:focus-visible, a:focus-visible { outline: 3px solid #ff7a10; outline-offset: 2px; }

  /* Franja inferior (marca) */
  footer { background: #0b4f9e; color: #fff; margin-top: 16px; border-top: 4px solid #ff7a10;
           padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 700px; margin: auto; }
  .logo { height: 40px; width: auto; display: block; }
  .follow-box { text-align: center; }
  footer .follow { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .social { display: flex; justify-content: center; gap: 8px; }
  .social a { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #fff; }
  .social svg { width: 26px; height: 26px; }
</style>
</head>
<body>

<header>
  <h1 id="mainTitle">Barrios Patrimoniales de Santiago</h1>
  <p id="mainSubtitle">Descubre y recorre los barrios con historia de Santiago</p>
  <div class="lang-bar">
    <div class="lang-label" id="langLabel">Selecciona tu idioma</div>
    <div class="lang-options" role="group" aria-label="Idioma / Language / Idioma">
      <button class="lang-btn" data-lang="es" onclick="changeLanguage('es')">🇪🇸 Español</button>
      <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">🇺🇸 English</button>
      <button class="lang-btn" data-lang="pt" onclick="changeLanguage('pt')">🇧🇷 Português</button>
    </div>
  </div>
</header>

<div class="progress" id="progress" aria-label="Progreso">
  <div class="progress-row">
    <strong id="progressText">0 de 10 lugares</strong>
    <button class="link-btn" id="resetTopBtn" onclick="resetProgress()">Reiniciar</button>
  </div>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</div>

<div id="map"></div>

<section class="places" id="placesList"></section>

<div class="completed" id="completed">
  <h2 id="compTitle">✓ Ruta completada</h2>
  <p id="compText">Has recorrido todos los lugares de esta ruta.</p>
  <button class="link-btn" id="resetBtn" onclick="resetProgress()">Reiniciar ruta</button>
</div>

<!-- Ficha del restaurante -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeCard()">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="placeTitle">
    <button class="close" onclick="closeCard()" aria-label="Cerrar">×</button>
    <img id="placeImage" class="card-image postal" src="" alt="">
    <div class="card-content">
      <h2 id="placeTitle"></h2>
      <div class="cuisine" id="placeCuisine"></div>
      <div class="description" id="placeDescription"></div>
      <div class="fact"><b id="factLabel">💡 Dato curioso</b><span id="placeFact"></span></div>
      <div class="info" id="placeInfo"></div>
      <div class="cats" id="placeCats"></div>
      <div class="buttons">
        <button class="action maps" id="mapBtn" onclick="goToMaps()">📍 Cómo llegar</button>
        <button class="action next" id="nextBtn" onclick="nextPlace()">Siguiente lugar →</button>
      </div>
    </div>
  </div>
</div>

// Imagen de ejemplo (SVG incrustado). Para foto real: image: "https://..."
function ph(label, c1, c2, tag) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="1200" height="600" fill="url(#g)"/>
    <g fill="#fff" fill-opacity=".3"><rect x="330" y="260" width="150" height="190"/><polygon points="310,260 405,170 500,260"/><rect x="520" y="200" width="170" height="250"/><polygon points="500,200 605,100 710,200"/><rect x="720" y="280" width="150" height="170"/><polygon points="700,280 795,200 890,280"/></g>
    <text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#fff" fill-opacity=".9">${label} · ${tag}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Enlace de Google Maps: usa el nombre + la dirección propia de cada restaurante
function gmaps(name, address, placeId) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(name + ", " + address) +
         (placeId ? "&destination_place_id=" + placeId : "");
}

// ================= ESTADO =================
let currentLang = "es";
let visited = loadVisited();
let currentPlace = null;

function loadVisited() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(v) ? v.filter(id => places.some(p => p.id === id)) : [];
  } catch (e) { return []; }
}
function saveVisited() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(visited)); } catch (e) {}
}

// ================= MAPA =================
const map = L.map("map").setView(MAP_CENTER, MAP_ZOOM);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

function pinIcon(n, isVisited) {
  return L.divIcon({
    className: "",
    html: `<div class="pin ${isVisited ? "visited" : ""}">${isVisited ? "✓" : n}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15]
  });
}

const routeCoords = places.map(p => [p.lat, p.lng]);
const markers = {};
if (routeCoords.length > 0) {
  L.polyline(routeCoords, { color: "#0b4f9e", weight: 4, opacity: .8, dashArray: "8 8" }).addTo(map);
  if (routeCoords.length === 1) map.setView(routeCoords[0], 16); else map.fitBounds(routeCoords, { padding: [30, 30] });
  places.forEach((p, i) => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(i + 1, false), title: p.name }).addTo(map);
    m.on("click", () => openCard(p.id));
    markers[p.id] = m;
  });
}

// ================= TEXTOS E IDIOMA =================
function updateTexts() {
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang === "pt" ? "pt-BR" : currentLang;
  document.title = t.mainTitle;
  document.getElementById("mainTitle").textContent = t.mainTitle;
  document.getElementById("mainSubtitle").textContent = t.mainSubtitle;
  document.getElementById("compTitle").textContent = t.compTitle;
  document.getElementById("compText").textContent = t.compText;
  document.getElementById("resetBtn").textContent = t.resetBtn;
  document.getElementById("resetTopBtn").textContent = t.resetTopBtn;
  document.getElementById("progress").setAttribute("aria-label", t.progressLabel);
  document.getElementById("mapBtn").textContent = t.mapBtn;
  document.getElementById("factLabel").textContent = t.factLabel;
  document.getElementById("followText").textContent = t.followUs;
  document.getElementById("langLabel").textContent = t.selectLang;
  document.querySelector(".close").setAttribute("aria-label", t.closeLabel);
  document.getElementById("igLink").href = INSTAGRAM_URL;
  document.getElementById("ttLink").href = TIKTOK_URL;
  document.getElementById("waLink").href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(WHATSAPP_TEXT);
  document.querySelectorAll(".lang-btn").forEach(b => {
    const on = b.dataset.lang === currentLang;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on);
  });
  if (currentPlace) fillCard();
}

function changeLanguage(lang) {
  currentLang = lang;
  updateTexts();
  render();
}

// ================= LISTA Y PROGRESO =================
function render() {
  const t = i18n[currentLang];
  const list = document.getElementById("placesList");
  list.innerHTML = "";
  if (places.length === 0) {
    list.innerHTML = `<p style="text-align:center; color:#66737f;">${t.placesNone}</p>`;
  }
  places.forEach((p, i) => {
    const isV = visited.includes(p.id);
    const b = document.createElement("button");
    b.className = "place" + (isV ? " visited" : "");
    b.onclick = () => openCard(p.id);
    // La lista NO muestra la dirección: solo número, nombre y tipo de cocina
    b.innerHTML = `
      <div class="num">${i + 1}</div>
      <div><h3>${p.name}</h3><p>${p.cuisine[currentLang] || p.cuisine.es}</p></div>
      <div class="check">✓</div>`;
    list.appendChild(b);
    if (markers[p.id]) markers[p.id].setIcon(pinIcon(i + 1, isV));
  });

  const total = places.length, count = visited.length;
  document.getElementById("progressText").textContent = `${count} ${t.progressOf} ${total} ${t.placesWord}`;
  document.getElementById("progressFill").style.width = total > 0 ? `${(count / total) * 100}%` : "0%";
  document.getElementById("progress").classList.toggle("done", total > 0 && count === total);
  document.getElementById("completed").classList.toggle("show", total > 0 && count === total);
  updateCardButtons();
}

// ================= FICHA =================
function fillCard() {
  const p = currentPlace, t = i18n[currentLang];
  const fallback = ph(p.name, p.c1, p.c2, t.sampleImg);
  const img = document.getElementById("placeImage");
  img.onerror = () => { img.onerror = null; img.src = fallback; };
  img.src = p.image || fallback;
  img.alt = p.name;
  document.getElementById("placeTitle").textContent = p.name;
  document.getElementById("placeCuisine").textContent = p.cuisine[currentLang] || p.cuisine.es;
  document.getElementById("placeDescription").textContent = p.description[currentLang] || p.description.es;
  document.getElementById("placeFact").textContent = p.fact[currentLang] || p.fact.es;
  const lineWord = { es: "Línea", en: "Line", pt: "Linha" }[currentLang];
  const metroTxt = p.metro.map(m => `${m.station} — ${lineWord} ${m.line}`);
  document.getElementById("placeInfo").innerHTML =
    `<div class="info-row"><b>${t.infoAddress}</b>${p.address}</div>` +
    `<div class="info-row"><b>${t.infoMetro}</b>${metroTxt[0]}<br>${t.alsoWord}: ${metroTxt[1]}</div>` +
    `<div class="info-row"><b>${t.infoHours}</b>${p.hours}</div>` +
    `<div class="info-row"><b>${t.infoEntry}</b>${p.entry[currentLang] || p.entry.es}</div>` +
    `<div class="info-row"><b>${t.infoPhone}</b>${p.phones.join("<br>")}</div>`;
  document.getElementById("placeCats").innerHTML = CATEGORIES.map(c =>
    `<div class="cat"><img src="${ICONS[c.icon]}" alt=""><div><div class="cat-name">${c.name[currentLang] || c.name.es}</div>` +
    `<div class="cat-items">${c.items[currentLang] || c.items.es}</div></div></div>`).join("");
  updateCardButtons();
}

function openCard(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  currentPlace = p;
  fillCard();
  const ov = document.getElementById("overlay");
  ov.classList.add("open");
  ov.scrollTop = 0;
  document.body.classList.add("locked");
}

function updateCardButtons() {
  if (!currentPlace) return;
  const t = i18n[currentLang];
  const last = places[places.length - 1].id === currentPlace.id;
  document.getElementById("nextBtn").textContent = last ? t.finishBtn : t.nextBtn;
}

function closeCard() {
  document.getElementById("overlay").classList.remove("open");
  document.body.classList.remove("locked");
}

// Siguiente lugar: deja el actual como recorrido (aunque se haya saltado) y avanza
function nextPlace() {
  if (!currentPlace) return;
  if (!visited.includes(currentPlace.id)) {
    visited.push(currentPlace.id);
    saveVisited();
  }
  render();
  const i = places.findIndex(p => p.id === currentPlace.id);
  if (i + 1 >= places.length) {
    closeCard();
    if (visited.length === places.length) {
      document.getElementById("completed").scrollIntoView({ behavior: "smooth" });
    }
    return;
  }
  const next = places[i + 1];
  map.panTo([next.lat, next.lng]);
  openCard(next.id);
}

// Cómo llegar: abre Google Maps con la dirección propia del restaurante
function goToMaps() {
  if (!currentPlace) return;
  window.open(currentPlace.mapsUrl, "_blank", "noopener");
}

function resetProgress() {
  visited = [];
  saveVisited();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

updateTexts();
render();
</script>
</body>
</html>
