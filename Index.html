<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Patrimonial — Día 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #1f2a33; }
  body.locked { overflow: hidden; }

  header { background: #123b5d; color: #fff; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 21px; }
  header p { margin: 4px 0 0; font-size: 14px; opacity: .9; }

  .progress { background: #fff; padding: 12px 16px; text-align: center; border-bottom: 1px solid #e1e5e9; }
  .progress strong { display: block; font-size: 16px; margin-bottom: 8px; }
  .bar { height: 8px; background: #e1e5e9; border-radius: 20px; overflow: hidden; max-width: 700px; margin: auto; }
  .fill { height: 100%; width: 0; background: #f28c28; transition: width .3s; }
  .progress.done .fill { background: #2e9d58; }

  #map { height: 46vh; min-height: 320px; width: 100%; }

  .pin { width: 34px; height: 34px; border-radius: 50%; background: #123b5d; color: #fff; border: 3px solid #fff;
         display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
         box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .pin.visited { background: #2e9d58; }

  .places { padding: 14px; max-width: 700px; margin: auto; }
  .place { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit;
           background: #fff; border: 0; border-left: 5px solid #123b5d; border-radius: 12px; padding: 14px;
           margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); cursor: pointer; }
  .place.visited { border-left-color: #2e9d58; }
  .place .num { width: 34px; height: 34px; border-radius: 50%; background: #123b5d; color: #fff; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .place.visited .num { background: #2e9d58; }
  .place h3 { margin: 0; font-size: 17px; }
  .place p { margin: 4px 0 0; font-size: 13px; color: #66737f; }
  .place .check { margin-left: auto; font-size: 22px; color: #2e9d58; visibility: hidden; }
  .place.visited .check { visibility: visible; }

  .completed { display: none; text-align: center; background: #fff; max-width: 700px; margin: 0 auto 24px;
               padding: 24px; border-radius: 14px; border: 2px solid #2e9d58; }
  .completed.show { display: block; }
  .completed h2 { margin: 0 0 6px; color: #2e9d58; }
  .completed p { margin: 0 0 14px; color: #55616c; }
  .link-btn { background: none; border: 0; color: #123b5d; text-decoration: underline; font: inherit; cursor: pointer; padding: 6px; }

  /* Ficha */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9999; padding: 14px; overflow-y: auto; }
  .overlay.open { display: block; }
  .card { background: #fff; max-width: 640px; margin: 20px auto; border-radius: 18px; overflow: hidden; position: relative; }
  .card-image { display: block; width: 100%; height: 220px; object-fit: cover; background: #cfd6dc; }
  .close { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%;
           background: rgba(0,0,0,.65); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .card-content { padding: 20px; }
  .card-content h2 { margin: 0 0 6px; color: #123b5d; }
  .address { font-weight: 700; margin-bottom: 14px; }
  .description { line-height: 1.6; color: #44505a; }
  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .action { border: 0; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; color: #fff; }
  .maps { background: #f28c28; }
  .visit { background: #2e9d58; }
  .visit.is-visited { background: #fff; color: #2e9d58; border: 2px solid #2e9d58; }
  .next { background: #123b5d; }
  button:focus-visible { outline: 3px solid #f28c28; outline-offset: 2px; }

  .leaflet-popup-content button { background: #123b5d; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 700; }

  @media (min-width: 600px) { .buttons { flex-direction: row; } .action { flex: 1; } }
</style>
</head>
<body>

<header>
  <h1>Ruta Patrimonial — Día 1</h1>
  <p>Descubre y recorre el patrimonio de Santiago</p>
</header>

<div class="progress" id="progress">
  <strong id="progressText">0 de 3</strong>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</div>

<div id="map"></div>

<section class="places" id="placesList"></section>

<div class="completed" id="completed">
  <h2>✓ Ruta completada</h2>
  <p>Visitaste los 3 lugares de esta ruta.</p>
  <button class="link-btn" onclick="resetProgress()">Reiniciar ruta</button>
</div>

<!-- Ficha del lugar -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeCard()">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="placeTitle">
    <button class="close" onclick="closeCard()" aria-label="Cerrar ficha">×</button>
    <img id="placeImage" class="card-image" src="" alt="">
    <div class="card-content">
      <h2 id="placeTitle"></h2>
      <div class="address" id="placeAddress"></div>
      <div class="description" id="placeDescription"></div>
      <div class="buttons">
        <button class="action maps" onclick="goToMaps()">📍 Cómo llegar</button>
        <button class="action visit" id="visitBtn" onclick="markVisited()">✓ Marcar como visitado</button>
        <button class="action next" id="nextBtn" onclick="nextPlace()">Siguiente lugar →</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const STORAGE_KEY = "rutaPatrimonialDia1";

// Imágenes de ejemplo (reemplazar por fotos reales: image: "https://...")
function ph(label, c1, c2) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="1200" height="600" fill="url(#g)"/>
    <g fill="#ffffff" fill-opacity=".22"><rect x="300" y="220" width="180" height="300"/><rect x="500" y="150" width="220" height="370"/><rect x="740" y="250" width="160" height="270"/></g>
    <g fill="#ffffff" fill-opacity=".35"><rect x="530" y="190" width="40" height="60"/><rect x="600" y="190" width="40" height="60"/><rect x="530" y="280" width="40" height="60"/><rect x="600" y="280" width="40" height="60"/></g>
    <text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#fff" fill-opacity=".9">${label} · imagen de ejemplo</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Verifica las coordenadas con Google Maps antes de publicar.
const places = [
  {
    id: 1,
    name: "Edificio Dieciocho (422)",
    address: "Dieciocho 422",
    lat: -33.4475, lng: -70.6572,
    image: ph("Edificio Dieciocho", "#123b5d", "#2c6e9b"),
    description: "Texto de ejemplo: aquí irá la reseña histórica de este edificio. Contará quién lo construyó, en qué época y por qué forma parte del patrimonio del barrio. Mientras tanto, mira su fachada, sus ventanas y los detalles que lo distinguen de los edificios vecinos."
  },
  {
    id: 2,
    name: "Plaza Concha y Toro",
    address: "Plaza Concha y Toro",
    lat: -33.4452, lng: -70.6528,
    image: ph("Plaza Concha y Toro", "#1f6b4a", "#4fa37a"),
    description: "Texto de ejemplo: aquí irá la historia de esta plaza. Explicará cómo nació el barrio, quiénes lo habitaron y qué cambió con los años. Mientras tanto, recorre el espacio, observa las casas que lo rodean y busca los detalles de la arquitectura antigua."
  },
  {
    id: 3,
    name: "Pasaje Hurtado de Rodríguez",
    address: "Pasaje Hurtado de Rodríguez",
    lat: -33.4460, lng: -70.6535,
    image: ph("Pasaje Hurtado de Rodríguez", "#8a4b1f", "#d9893f"),
    description: "Texto de ejemplo: aquí irá la historia de este pasaje. Contará por qué se trazó, quiénes vivieron aquí y qué lo hace especial. Mientras tanto, camina despacio y fíjate en la escala de las casas, los muros y los pequeños detalles de cada entrada."
  }
];

// ---------- Memoria (localStorage) ----------
function loadVisited() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveVisited() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(visited)); } catch (e) {}
}
let visited = loadVisited();
let currentPlace = null;

// ---------- Mapa ----------
const map = L.map("map").setView([-33.4460, -70.6550], 16);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const routeCoords = places.map(p => [p.lat, p.lng]);
L.polyline(routeCoords, { color: "#123b5d", weight: 4, opacity: .8, dashArray: "8 8" }).addTo(map);
map.fitBounds(routeCoords, { padding: [40, 40] });

const markers = {};
places.forEach((p, i) => {
  const m = L.marker([p.lat, p.lng], { icon: pinIcon(i + 1, false), title: p.name }).addTo(map);
  m.on("click", () => openCard(p.id));
  markers[p.id] = m;
});

function pinIcon(n, isVisited) {
  return L.divIcon({
    className: "",
    html: `<div class="pin ${isVisited ? "visited" : ""}">${isVisited ? "✓" : n}</div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

// ---------- Lista y progreso ----------
function render() {
  const list = document.getElementById("placesList");
  list.innerHTML = "";
  places.forEach((p, i) => {
    const isV = visited.includes(p.id);
    const b = document.createElement("button");
    b.className = "place" + (isV ? " visited" : "");
    b.onclick = () => openCard(p.id);
    b.innerHTML = `
      <div class="num">${i + 1}</div>
      <div><h3>${p.name}</h3><p>${p.address}</p></div>
      <div class="check">✓</div>`;
    list.appendChild(b);
    markers[p.id].setIcon(pinIcon(i + 1, isV));
  });

  const total = places.length, count = visited.length;
  document.getElementById("progressText").textContent = `${count} de ${total}`;
  document.getElementById("progressFill").style.width = `${(count / total) * 100}%`;
  document.getElementById("progress").classList.toggle("done", count === total);
  document.getElementById("completed").classList.toggle("show", count === total);
  updateCardButtons();
}

// ---------- Ficha ----------
function openCard(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  currentPlace = p;
  map.closePopup();
  const img = document.getElementById("placeImage");
  img.onerror = () => { img.onerror = null; img.removeAttribute("src"); };
  img.src = p.image;
  img.alt = p.name;
  document.getElementById("placeTitle").textContent = p.name;
  document.getElementById("placeAddress").textContent = "📍 " + p.address;
  document.getElementById("placeDescription").textContent = p.description;
  updateCardButtons();
  const ov = document.getElementById("overlay");
  ov.classList.add("open");
  ov.scrollTop = 0;
  document.body.classList.add("locked");
}

function updateCardButtons() {
  if (!currentPlace) return;
  const isV = visited.includes(currentPlace.id);
  const vb = document.getElementById("visitBtn");
  vb.textContent = isV ? "✓ Visitado" : "✓ Marcar como visitado";
  vb.classList.toggle("is-visited", isV);
  const last = places[places.length - 1].id === currentPlace.id;
  document.getElementById("nextBtn").textContent = last ? "Finalizar ruta" : "Siguiente lugar →";
}

function closeCard() {
  document.getElementById("overlay").classList.remove("open");
  document.body.classList.remove("locked");
}

function markVisited() {
  if (!currentPlace) return;
  if (!visited.includes(currentPlace.id)) {
    visited.push(currentPlace.id);
    saveVisited();
  }
  render();
}

function nextPlace() {
  if (!currentPlace) return;
  markVisited();
  const i = places.findIndex(p => p.id === currentPlace.id);
  if (i + 1 >= places.length) {
    closeCard();
    if (visited.length === places.length) {
      document.getElementById("completed").scrollIntoView({ behavior: "smooth" });
    }
    return;
  }
  const next = places[i + 1];
  map.panTo([next.lat, next.lng]);
  openCard(next.id);
}

function goToMaps() {
  if (!currentPlace) return;
  const dest = encodeURIComponent(`${currentPlace.name}, ${currentPlace.address}, Santiago, Chile`);
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}`, "_blank", "noopener");
}

function resetProgress() {
  visited = [];
  saveVisited();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

render();
</script>
</body>
</html>
